name: Attested Windows release build

on:
  workflow_call:
    inputs:
      commit:
        description: Exact source commit to build
        required: true
        type: string
      version:
        description: Stable NuGet package version
        required: true
        type: string
    outputs:
      artifact_id:
        description: Immutable GitHub Actions artifact containing the attested packages
        value: ${{ jobs.build.outputs.artifact_id }}

permissions:
  contents: read

jobs:
  build:
    name: Build, test and attest
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check release identity
        shell: pwsh
        env:
          BUILD_COMMIT: ${{ inputs.commit }}
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          if ($env:BUILD_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or
              $env:BUILD_VERSION -cnotmatch '^\d+\.\d+\.\d+$') {
            throw 'Invalid source commit or release version'
          }
          if ((git rev-parse HEAD).Trim() -cne $env:BUILD_COMMIT) {
            throw 'Checked-out source does not match the resolved release commit'
          }

      - name: Set up .NET 10 SDK and test runtimes
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore unit tests and library
        run: dotnet restore tests/WinCfApiWrapper.Tests/WinCfApiWrapper.Tests.csproj

      - name: Unit and archive stress tests
        env:
          RZM_RUN_ARCHIVE_STRESS: '1'
        run: dotnet test tests/WinCfApiWrapper.Tests/WinCfApiWrapper.Tests.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Restore integration tests
        run: dotnet restore tests/WinCfApiWrapper.IntegrationTests/WinCfApiWrapper.IntegrationTests.csproj

      - name: Offline integration and stress tests
        run: >-
          dotnet test
          tests/WinCfApiWrapper.IntegrationTests/WinCfApiWrapper.IntegrationTests.csproj
          --configuration Release --no-restore
          --filter "Category=Offline"
          --blame-hang-timeout 3m

      - name: Live E2E tests
        env:
          RZM_RUN_LIVE_TESTS: '1'
        run: >-
          dotnet test
          tests/WinCfApiWrapper.IntegrationTests/WinCfApiWrapper.IntegrationTests.csproj
          --configuration Release --no-build --no-restore
          --filter "Category=Live"
          --blame-hang-timeout 3m

      - name: Pack release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          dotnet pack src/WinCfApiWrapper/WinCfApiWrapper.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true "-p:Version=$env:RELEASE_VERSION" --output artifacts
          if ($LASTEXITCODE -ne 0) { throw 'dotnet pack failed' }

      - name: Attest release packages
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'artifacts/*'

      # The attestation is created in this isolated build and transferred with
      # the exact package bytes. Do not re-sign or fabricate it in the publish job.
      - name: Export signed in-toto provenance bundle
        shell: pwsh
        env:
          SIGNED_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path -LiteralPath $env:SIGNED_BUNDLE -PathType Leaf)) {
            throw 'The signed provenance bundle is missing from the attestation action.'
          }
          try {
            $bundle = Get-Content -LiteralPath $env:SIGNED_BUNDLE -Raw -ErrorAction Stop |
              ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw "Attestation action returned malformed Sigstore bundle JSON: $_"
          }
          if (-not $bundle.dsseEnvelope -or -not $bundle.verificationMaterial -or
              -not $bundle.dsseEnvelope.payload -or
              -not ($bundle.dsseEnvelope.signatures -is [array]) -or
              $bundle.dsseEnvelope.signatures.Count -lt 1 -or
              @($bundle.dsseEnvelope.signatures | Where-Object {
                $null -eq $_ -or -not ($_.sig -is [string]) -or [string]::IsNullOrWhiteSpace($_.sig)
              }).Count -gt 0) {
            throw 'Attestation action returned a Sigstore bundle without valid DSSE signatures.'
          }
          $provenance = Join-Path (Get-Location) "artifacts/WinCfApiWrapper.$env:BUILD_VERSION.intoto.jsonl"
          # The Sigstore bundle is a single JSON object; one compact JSON line
          # is valid JSONL and directly supported by gh attestation verify.
          $line = $bundle | ConvertTo-Json -Depth 100 -Compress
          [IO.File]::WriteAllText($provenance, "$line`n", [Text.UTF8Encoding]::new($false))
          foreach ($extension in @('nupkg', 'snupkg')) {
            $package = Join-Path (Get-Location) "artifacts/WinCfApiWrapper.$env:BUILD_VERSION.$extension"
            if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
              throw "Missing attested package $package."
            }
            gh attestation verify $package --bundle $provenance --repo $env:GITHUB_REPOSITORY `
              --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/attested-release-build.yml" `
              --source-ref refs/heads/master --source-digest $env:BUILD_COMMIT
            if ($LASTEXITCODE -ne 0) { throw "Offline bundle verification failed for $package." }
          }

      - name: Upload immutable attested packages
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slsa-attested-release-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/*.intoto.jsonl
          if-no-files-found: error
          retention-days: 90
