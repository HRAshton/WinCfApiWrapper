name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  reuse-lint:
    name: REUSE compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run REUSE lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  build-and-test:
    name: Build and tests (Windows, ${{ matrix.framework }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0-windows, net10.0-windows]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET 10 SDK and test runtimes
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Validate release recovery script syntax
        if: matrix.framework == 'net8.0-windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'scripts/release-transaction.ps1'),
            [ref]$tokens, [ref]$errors
          )
          if (@($errors).Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw 'Release transaction script has PowerShell syntax errors'
          }

      - name: Test release retry package integrity checks
        if: matrix.framework == 'net8.0-windows'
        shell: pwsh
        run: ./scripts/release-transaction.ps1 -Phase SelfTest

      - name: Validate GitVersion configuration
        if: matrix.framework == 'net8.0-windows'
        shell: pwsh
        run: |
          dotnet tool install --global GitVersion.Tool --version 6.8.2
          if ($LASTEXITCODE -ne 0) { throw "GitVersion installation failed" }
          $semver = (& dotnet-gitversion /showvariable SemVer /config GitVersion.yml 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $semver -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Host $semver
            throw "GitVersion failed to produce valid SemVer"
          }
          Write-Host "GitVersion SemVer: $semver"
          $stable = (& dotnet-gitversion /showvariable MajorMinorPatch /config GitVersion.yml 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $stable -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host $stable
            throw "GitVersion did not produce a stable MajorMinorPatch candidate"
          }
          Write-Host "GitVersion release candidate: $stable"

      - name: Restore unit tests and library
        run: dotnet restore tests/WinCfApiWrapper.Tests/WinCfApiWrapper.Tests.csproj

      - name: Restore native integration test project
        run: dotnet restore tests/WinCfApiWrapper.IntegrationTests/WinCfApiWrapper.IntegrationTests.csproj

      - name: Build unit tests and library
        run: dotnet build tests/WinCfApiWrapper.Tests/WinCfApiWrapper.Tests.csproj --framework ${{ matrix.framework }} --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Compile native integration tests
        run: dotnet build tests/WinCfApiWrapper.IntegrationTests/WinCfApiWrapper.IntegrationTests.csproj --framework ${{ matrix.framework }} --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Unit tests and coverage
        if: matrix.framework == 'net8.0-windows'
        run: dotnet test tests/WinCfApiWrapper.Tests/WinCfApiWrapper.Tests.csproj --framework ${{ matrix.framework }} --configuration Release --no-build --no-restore --collect "Code Coverage" --settings tests/coverage.runsettings --results-directory TestResults

      - name: Unit tests
        if: matrix.framework != 'net8.0-windows'
        run: dotnet test tests/WinCfApiWrapper.Tests/WinCfApiWrapper.Tests.csproj --framework ${{ matrix.framework }} --configuration Release --no-build --no-restore

      - name: Report line coverage
        if: matrix.framework == 'net8.0-windows'
        id: coverage
        shell: pwsh
        run: |
          $report = Get-ChildItem TestResults -Filter '*.cobertura.xml' -Recurse |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $report) { throw "No Cobertura report was generated" }
          [xml]$coverage = Get-Content $report.FullName -Raw
          $rate = [double]::Parse($coverage.coverage.'line-rate', [System.Globalization.CultureInfo]::InvariantCulture)
          $pct = [math]::Round($rate * 100, 2)
          Write-Host "Unit-test line coverage: $pct%"
          "### Unit-test line coverage: $pct%" >> $env:GITHUB_STEP_SUMMARY
          $relative = [IO.Path]::GetRelativePath((Get-Location).Path, $report.FullName).Replace('\', '/')
          "file=$relative" >> $env:GITHUB_OUTPUT

      - name: Upload coverage report
        if: matrix.framework == 'net8.0-windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-coverage
          path: TestResults/**/*.cobertura.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: matrix.framework == 'net8.0-windows'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ steps.coverage.outputs.file }}
          disable_search: true
          flags: unittests
          fail_ci_if_error: true

      # Includes offline stress tests. Live-network E2E is gated on release.
      - name: Offline integration and stress tests
        run: >-
          dotnet test
          tests/WinCfApiWrapper.IntegrationTests/WinCfApiWrapper.IntegrationTests.csproj
          --framework ${{ matrix.framework }}
          --configuration Release --no-build --no-restore
          --filter "Category=Offline"
          --blame-hang-timeout 3m

      - name: Verify NuGet package
        if: matrix.framework == 'net8.0-windows'
        run: dotnet pack src/WinCfApiWrapper/WinCfApiWrapper.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true --output artifacts

      - name: Upload package preview
        if: matrix.framework == 'net8.0-windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-preview
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
