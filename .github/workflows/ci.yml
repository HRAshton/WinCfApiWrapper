name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The .slnx format requires a newer SDK than the .NET 8 compiler used here.
      - name: Validate GitVersion configuration
        shell: pwsh
        run: |
          dotnet tool install --global GitVersion.Tool --version 6.8.2
          if ($LASTEXITCODE -ne 0) { throw "GitVersion installation failed" }
          $semver = (dotnet-gitversion /showvariable SemVer /config GitVersion.yml | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($semver)) {
            throw "GitVersion failed to calculate a version"
          }
          Write-Host "GitVersion SemVer: $semver"

      - name: Restore unit tests and library
        run: dotnet restore tests/WinCfApiWrapper.Tests/WinCfApiWrapper.Tests.csproj

      - name: Restore native integration test project
        run: dotnet restore tests/WinCfApiWrapper.IntegrationTests/WinCfApiWrapper.IntegrationTests.csproj

      - name: Build unit tests and library
        run: dotnet build tests/WinCfApiWrapper.Tests/WinCfApiWrapper.Tests.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Compile native integration tests
        run: dotnet build tests/WinCfApiWrapper.IntegrationTests/WinCfApiWrapper.IntegrationTests.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Unit tests
        run: dotnet test tests/WinCfApiWrapper.Tests/WinCfApiWrapper.Tests.csproj --configuration Release --no-build --no-restore

      - name: Verify NuGet package
        run: dotnet pack src/WinCfApiWrapper/WinCfApiWrapper.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true --output artifacts

      - name: Upload package preview
        uses: actions/upload-artifact@v4
        with:
          name: nuget-preview
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
