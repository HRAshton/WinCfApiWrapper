name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WinCfApiWrapper.slnx

      - name: Build
        run: dotnet build WinCfApiWrapper.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Unit tests
        run: dotnet test tests/WinCfApiWrapper.Tests/WinCfApiWrapper.Tests.csproj --configuration Release --no-build --no-restore

      - name: Verify NuGet package
        run: dotnet pack src/WinCfApiWrapper/WinCfApiWrapper.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true --output artifacts

      - name: Upload package preview
        uses: actions/upload-artifact@v4
        with:
          name: nuget-preview
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
