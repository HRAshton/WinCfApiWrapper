name: Live E2E (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-e2e:
    name: Live GitHub ZIP E2E (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # External download test is deliberately opt-in outside release.
      - name: Run live E2E tests
        env:
          RZM_RUN_LIVE_TESTS: '1'
        run: >-
          dotnet test
          tests/WinCfApiWrapper.IntegrationTests/WinCfApiWrapper.IntegrationTests.csproj
          --configuration Release
          --filter "Category=Live"
          --blame-hang-timeout 3m
