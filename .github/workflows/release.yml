name: Publish NuGet

on:
  schedule:
    - cron: '17 12 * * 4'
      timezone: 'Europe/Belgrade'
  workflow_dispatch:

concurrency:
  group: nuget-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    if: github.ref == 'refs/heads/master'
    name: Resolve release identity
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Checkout complete Git history and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve release transaction
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-transaction.ps1 -Phase Resolve

  build:
    name: Isolated SLSA-attested build
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/attested-release-build.yml
    with:
      commit: ${{ needs.resolve.outputs.commit }}
      version: ${{ needs.resolve.outputs.version }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

  publish:
    name: Reconcile and publish verified artifacts
    needs: [resolve, build]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: write
      id-token: write
      attestations: read
    steps:
      - name: Checkout release transaction and Git tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Download exact attested build output
        if: needs.resolve.outputs.build == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts

      - name: Stage draft GitHub Release with manifest
        if: needs.resolve.outputs.build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: ./scripts/release-transaction.ps1 -Phase Stage

      - name: Verify immutable artifacts and SLSA provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: ./scripts/release-transaction.ps1 -Phase VerifyStage

      - name: Reconcile existing NuGet publication
        id: nuget_status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: ./scripts/release-transaction.ps1 -Phase InspectNuGet

      - name: Obtain NuGet Trusted Publishing token
        if: steps.nuget_status.outputs.publish == 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish or recover NuGet package
        if: steps.nuget_status.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: ./scripts/release-transaction.ps1 -Phase PushNuGet

      - name: Reconcile and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: ./scripts/release-transaction.ps1 -Phase Finalize
